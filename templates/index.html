<!DOCTYPE html>
<html>
<head>
    <title>SymCheck Africa</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>SymCheck Africa</h1>
    <form method="POST" action="/check">
        <label for="symptoms">Enter symptoms (e.g., fever, headache):</label>
        <input type="text" name="symptoms" placeholder="e.g., fever, headache, sore throat">

        <label for="mode">Select your profile:</label>
        <select name="mode">
            <option value="general">General</option>
            <option value="petroleum">Petroleum Engineer</option>
        </select>

        <button type="submit">Check</button>
    </form>

    {% if result %}
        <h2>Possible Condition: {{ result }}</h2>
        {% if urgency %}
            <p><strong>Urgency Level:</strong> {{ urgency | capitalize }}</p>
        {% endif %}
    {% endif %}
</body>
          </html>
